[package]
authors = ["Chris Yunker <chrisyunker@gmail.com>"]
edition = "2021"
readme = "README.md"
name = "gatt-server"
version = "0.1.0"

[dependencies]
embassy-stm32 = { version = "0.2.0", git = "https://github.com/chrisyunker/embassy.git", rev = "3e04d2476", features = [
    "defmt",
    "stm32wb55rg",
    "memory-x",
    "time-driver-any",
    "exti",
]}
embassy-stm32-wpan = { version = "0.1.0", git = "https://github.com/chrisyunker/embassy.git", rev = "3e04d2476", features = [
    "defmt",
    "stm32wb55rg",
    "ble",
    "mac",
] }
embassy-sync = { version = "0.6.2", git = "https://github.com/chrisyunker/embassy.git", rev = "3e04d2476", features = [
    "defmt"
] }
embassy-executor = { version = "0.7.0", git = "https://github.com/chrisyunker/embassy.git", rev = "3e04d2476", features = [
    "defmt",
    "arch-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.4.0", git = "https://github.com/chrisyunker/embassy.git", rev = "3e04d2476", features = [ 
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768"
] }
embassy-net = { version = "0.7.0", git = "https://github.com/chrisyunker/embassy.git", rev = "3e04d2476", features = [
    "defmt",
    "udp",
    "proto-ipv6",
    "medium-ieee802154",
], optional=true }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core"
] }
cortex-m-rt = "0.7.0"
embedded-hal = "0.2.6"
panic-probe = { version = "0.3", features = [ "print-defmt" ] }
heapless = { version = "0.8", default-features = false }
static_cell = "2"

[features]

[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations
